# nginx configuration for the Ooga scraper service
# Domain: api.haooga.com → localhost:3001
#
# Place in: /etc/nginx/sites-available/ooga-scraper
# Enable with: ln -s /etc/nginx/sites-available/ooga-scraper /etc/nginx/sites-enabled/
# Then run: certbot --nginx -d api.haooga.com

# Cal's SMS sign-in, per client address: a coarse limit in front of the service's own per-account
# limits (scraper/src/rate-limit.ts). The zone sits outside `server` (this file is included in http).
limit_req_zone $binary_remote_addr zone=ooga_cal:1m rate=6r/m;

server {
    listen 80;
    server_name api.haooga.com;

    location /cal/ {
        limit_req          zone=ooga_cal burst=4 nodelay;
        limit_req_status   429;
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # certbot will automatically replace this with an HTTPS redirect + SSL block
    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Scraping can take up to 2 minutes — don't timeout too early
        proxy_read_timeout  180s;
        proxy_send_timeout  180s;
    }
}
