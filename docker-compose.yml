services:
  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - path: scraper/.env.scraper
        required: false
    environment:
      # Fallback: set these directly here for quick dev, or put them in .env.scraper
      PORT: "3001"
    restart: unless-stopped
    # Allow Puppeteer/Chromium to run without a sandbox in Docker
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
