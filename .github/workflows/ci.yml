name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR pushes are cancelled; every master commit keeps its result (it deploys)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Web app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:run
      - name: Build (what Cloudflare runs)
        run: npm run build

  lint:
    name: Lint (ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Pre-existing errors. Lower this as they get fixed; never raise it.
      ESLINT_MAX_ERRORS: 124
      # On-screen English not yet in src/i18n/locales. Lower it as screens are translated; never raise it.
      UNTRANSLATED_MAX: 215
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint must not get worse
        run: node .github/scripts/eslint-ratchet.mjs
      - name: Untranslated text must not grow
        run: node .github/scripts/untranslated-ratchet.mjs

  scraper:
    name: Scraper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scraper
    env:
      # Production uses the image's system Chromium (see scraper/Dockerfile)
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22 # keep in sync with scraper/Dockerfile
          cache: npm
          cache-dependency-path: scraper/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
